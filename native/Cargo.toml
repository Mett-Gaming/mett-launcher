[workspace]
resolver = "3"
members = ["mett-net-proto", "mett-net", "mett-netd"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mett-Gaming/mett-launcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mett-net-proto = { path = "mett-net-proto" }

[profile.release]
lto = "thin"
strip = true
